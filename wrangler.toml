# Add this file to the ROOT of your GitHub repo (same folder as HOME.html).
# It tells Cloudflare: "serve the files in this folder as before, but also
# run worker.js so it can handle the /api/recent-videos route."
#
# After committing this + worker.js and pushing to GitHub, Cloudflare
# should pick it up automatically on the next deploy. If the deploy
# fails or your site stops loading afterwards, check
# Workers & Pages > your worker > Settings > Build for any build
# command that might need adjusting - but for a plain static site like
# yours, this should just work with no extra settings.

name = "webtiergd"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./"
binding = "ASSETS"
